<title>Lindy Hop Basics for Fellas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Look: a 1920s–30s Harlem ballroom dance programme. Cream card stock, ink, oxblood and brass,
   Art Deco rules and corners. Dark mode is the ballroom after hours: black lacquer and gold.
   Layout: library list on the left, a count-by-count step sheet on the right; stacks on phones. */
:root{
  --bg:#EFE4CC; --surface:#FAF4E4; --sunk:#E6D8B8; --ink:#231A12; --muted:#6B5A45; --line:#C9B48C;
  --brass:#A87A24; --brass-soft:#F0DDB0; --brass-ink:#4E3608;
  --savoy:#8E2A22; --savoy-soft:#F1D7CC;
  --lead:#1F3A5F; --follow:#2E6046; --danger:#9B1C14;
  --grain:rgba(90,60,20,.07);
  --display:"Limelight","Playfair Display",Georgia,serif;
  --head:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13100C; --surface:#1C1712; --sunk:#262019; --ink:#F1E6CC; --muted:#B9A684; --line:#4A3D2A;
  --brass:#D9AE52; --brass-soft:#3A2D14; --brass-ink:#F2D68E;
  --savoy:#E07A68; --savoy-soft:#3A1E19; --lead:#9DB8DE; --follow:#8CC7A2; --danger:#F08A7E;
  --grain:rgba(217,174,82,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13100C; --surface:#1C1712; --sunk:#262019; --ink:#F1E6CC; --muted:#B9A684; --line:#4A3D2A;
  --brass:#D9AE52; --brass-soft:#3A2D14; --brass-ink:#F2D68E;
  --savoy:#E07A68; --savoy-soft:#3A1E19; --lead:#9DB8DE; --follow:#8CC7A2; --danger:#F08A7E;
  --grain:rgba(217,174,82,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:radial-gradient(var(--grain) 1px,transparent 1.2px),radial-gradient(var(--grain) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* masthead: centred, between double rules, with a deco fan */
header.top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  border-top:5px double var(--ink);border-bottom:5px double var(--ink);padding:18px 8px 16px;position:relative}
.fan{display:block;width:96px;height:30px;color:var(--brass)}
.brand .kicker{font-family:var(--head);font-style:italic;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--savoy);margin:0 0 6px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,68px);line-height:1;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.brand h1 span{display:block;font-family:var(--head);font-style:italic;font-weight:700;text-transform:none;letter-spacing:.02em;font-size:.5em;color:var(--brass);margin-top:4px}
.brand p{margin:10px 0 0;color:var(--muted);font-size:14px;font-style:italic}
.brand p::before,.brand p::after{content:"\2726";color:var(--brass);font-style:normal;margin:0 .6em;font-size:.8em}
.tempo-strip{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

button,.btn{font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:var(--r);border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  box-shadow:2px 2px 0 var(--line)}
button:hover,.btn:hover{background:var(--brass-soft)}
button:active,.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible,a:focus-visible{outline:2px solid var(--savoy);outline-offset:2px}
button.primary{background:var(--savoy);color:#FAF4E4;border-color:var(--savoy)}
button.primary:hover{background:var(--savoy);filter:brightness(1.1)}
:root[data-theme="dark"] button.primary{color:#1C1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#1C1712}}
button.brass{background:var(--brass);color:#1E1500;border-color:var(--brass)}
button.ghost{background:transparent;box-shadow:none}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button:disabled{opacity:.5;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){aside{position:static}}
.search{width:100%;font:inherit;font-style:italic;padding:9px 4px;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* the library reads like a dance card */
.list{display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto;padding-right:2px}
@media (max-width:820px){.list{max-height:none}}
.group{font-family:var(--head);font-style:italic;font-size:15px;font-weight:700;color:var(--savoy);margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-radius:var(--r);border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;width:100%;font-family:var(--body);font-weight:400;letter-spacing:0;box-shadow:none}
.item:hover{background:var(--sunk);border-color:transparent}
.item[aria-current="true"]{background:var(--surface);border-color:var(--ink);box-shadow:3px 3px 0 var(--brass)}
.item b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item small{grid-column:1/-1;color:var(--muted);font-size:12px;font-style:italic}
.tag{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--r);border:1px solid var(--brass);background:var(--brass-soft);color:var(--brass-ink);align-self:start}
.tag.eight{background:var(--savoy-soft);color:var(--savoy);border-color:var(--savoy)}

/* the step sheet: a programme page with a double frame and deco corners */
main{min-width:0}
.sheet{position:relative;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r);
  outline:1px solid var(--line);outline-offset:-8px;
  box-shadow:6px 6px 0 var(--sunk);
  padding:clamp(22px,3.4vw,38px);display:flex;flex-direction:column;gap:24px;min-width:0}
.sheet::before,.sheet::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--brass);pointer-events:none}
.sheet::before{top:14px;left:14px;border-right:0;border-bottom:0}
.sheet::after{bottom:14px;right:14px;border-left:0;border-top:0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.8vw,48px);line-height:1.05;margin:0;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--muted)}
.summary{margin:0;max-width:65ch;color:var(--ink);font-size:16px}
.summary::first-letter{font-family:var(--display);float:left;font-size:3.1em;line-height:.85;padding:6px 4px 0 0;color:var(--savoy)}
.head-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.label{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--savoy);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.label::before{content:"\2766";letter-spacing:0;color:var(--brass);font-size:15px}
.label::after{content:"";flex:1;border-top:1px solid var(--line);max-width:240px}

/* demo video: framed like a newsreel */
.video{position:relative;width:100%;max-width:720px;aspect-ratio:16/9;border-radius:0;overflow:hidden;background:#000;border:6px solid var(--ink);box-shadow:0 0 0 1px var(--brass),4px 4px 0 1px var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:sepia(.15)}
.vlink{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);font-style:italic}

/* count player */
.player{border:1px solid var(--ink);border-radius:var(--r);background:var(--sunk);padding:16px;display:flex;flex-direction:column;gap:14px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--savoy)}
.bpm{font-family:var(--mono);font-size:13px;font-weight:700;min-width:70px;display:inline-flex;align-items:center;gap:4px}
.bpm input{font:inherit;width:3.6em;text-align:center;padding:6px 2px;border:1px solid var(--ink);border-radius:var(--r);background:var(--surface);color:var(--ink);-moz-appearance:textfield}
.bpm input::-webkit-inner-spin-button,.bpm input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bpm .stp{min-width:32px;padding:6px 0;justify-content:center}
.beats{display:flex;gap:6px;flex-wrap:wrap}
.beat{font-family:var(--display);font-weight:400;font-size:18px;min-width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--ink);background:var(--surface);color:var(--muted);padding:0 6px;cursor:pointer;box-shadow:none;letter-spacing:0}
.beat.amp{min-width:28px;width:28px;height:28px;align-self:center;font-family:var(--head);font-size:13px;padding:0}
.beat.on{background:var(--savoy);border-color:var(--savoy);color:#FAF4E4}
.now{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.now{grid-template-columns:auto minmax(0,1fr)}.now .f{grid-column:2}}
.bigc{font-family:var(--display);font-weight:400;font-size:68px;line-height:.9;min-width:56px;color:var(--savoy)}
.who{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.who.l{color:var(--lead)} .who.f{color:var(--follow)}
.now p{margin:2px 0 0;font-size:14px}

/* footprints */
.feet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fp svg{width:100%;max-width:240px;align-self:center;display:block}
.fp .fd{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);text-align:center;min-height:18px}
.foot{transition:transform .16s ease-out}

/* steps table: ruled like a typed programme */
.tbl{overflow-x:auto;border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px dotted var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;background:transparent;border-bottom:1px solid var(--ink)}
td.c{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;width:56px;color:var(--savoy);text-align:center}
tr.on td{background:var(--brass-soft)}
tr.on td.c{color:var(--brass-ink)}
th.l{color:var(--lead)} th.f{color:var(--follow)}
.tips{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.tips li{position:relative;padding-left:24px}
.tips li::before{content:"\2726";position:absolute;left:2px;top:0;color:var(--brass)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;font-style:italic}
.empty strong{font-family:var(--display);font-weight:400;font-style:normal;font-size:30px;color:var(--ink);text-transform:uppercase}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.bar .sp{flex:1}
.note{font-size:13px;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.04em;z-index:10;box-shadow:3px 3px 0 var(--brass)}

/* phones: moves become a swipeable row, the step sheet stacks, controls get thumb-sized */
@media (max-width:820px){
  body{padding-block:14px 36px}
  .wrap{gap:16px}
  header.top{padding:14px 4px 12px;gap:6px}
  .fan{width:72px;height:22px}
  .brand p{font-size:13px}
  .grid{gap:16px}
  aside{gap:10px}
  .list{flex-direction:row;overflow-x:auto;gap:8px;max-height:none;padding:2px 6px 8px 2px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .group{display:none}
  .list .note{white-space:nowrap}
  .item{flex:0 0 auto;width:auto;max-width:72vw;min-width:150px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);padding:10px 12px;min-height:56px}
  .item b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item small{white-space:nowrap}
  .item[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--savoy)}
  .search{font-size:16px;padding:10px 4px}
  .chip{padding:6px 12px;font-size:13px}
}
@media (max-width:560px){
  .sheet{padding:22px 18px;gap:20px;outline-offset:-6px;box-shadow:4px 4px 0 var(--sunk)}
  .sheet::before{top:10px;left:10px;width:18px;height:18px}
  .sheet::after{bottom:10px;right:10px;width:18px;height:18px}
  .sheet h2{font-size:32px}
  .player{padding:12px;gap:12px}
  .ctl{gap:8px}
  .ctl button{min-height:44px;flex:1 1 40%;justify-content:center}
  .ctl label{order:3}
  .ctl input[type=range]{order:4;flex:1 1 0;min-width:0;height:32px}
  .bpm{order:5;text-align:right}
  .ctl .bpm .stp{flex:0 0 auto;min-width:44px;min-height:44px}
  .bpm input{min-height:44px;font-size:16px}
  .beats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
  .beat{min-width:0;width:auto;height:auto;aspect-ratio:1;max-height:48px;font-size:16px}
  .beat.amp{min-width:0;width:auto;height:auto;aspect-ratio:1;font-size:12px}
  .feet{gap:8px}
  .fp{padding:8px 6px 6px}
  .now{grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
  .now .f{grid-column:2}
  .bigc{font-size:54px;min-width:44px}
  .tbl{border:0;overflow:visible}
  table{min-width:0;font-size:14px}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:8px}
  tr{display:grid;grid-template-columns:44px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  td{border:0;padding:8px 12px 8px 0}
  td.c{grid-row:1/3;width:auto;display:grid;place-items:center;padding:0;background:var(--sunk);font-size:20px}
  td:nth-child(2){padding-left:12px;padding-bottom:2px}
  td:nth-child(3){padding-left:12px;padding-top:2px;border-top:1px dotted var(--line)}
  td:nth-child(2)::before,td:nth-child(3)::before{display:block;font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  td:nth-child(2)::before{content:"Leader";color:var(--lead)}
  td:nth-child(3)::before{content:"Follower";color:var(--follow)}
  tr.on{border-color:var(--savoy)}
  .tips{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <svg class="fan" viewBox="0 0 96 30" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 29a40 40 0 0 1 80 0"/><path d="M20 29a28 28 0 0 1 56 0"/><path d="M32 29a16 16 0 0 1 32 0"/><path d="M48 29V3M48 29 27 8M48 29 69 8M48 29 14 19M48 29 82 19"/><path d="M2 29h92"/></svg>
    <div class="brand">
      <p class="kicker">Swing Era Dance Instruction</p>
      <h1>Lindy Hop Basics <span>for Fellas</span></h1>
      <p>Your moves, count by count, for leader and follower.</p>
    </div>
    <div class="bar">
      <span class="tempo-strip" id="countInfo">Loading tutorials…</span>
    </div>
  </header>

  <div class="grid">
    <aside>
      <input class="search" id="q" type="search" placeholder="Search moves, notes…" aria-label="Search tutorials">
      <div class="chips" id="filters" role="group" aria-label="Filter by rhythm"></div>
      <nav class="list" id="list" aria-label="Tutorials"></nav>
    </aside>
    <main id="main">
      <section class="sheet"><div class="empty"><strong>Loading tutorials</strong><span>Your library appears here in a moment.</span></div></section>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
var tuts=[],sel=null,filter='All',query='',ready=false;
var play={t:null,i:-1,bpm:70};
function setBpm(v,src){v=Math.round(+v);if(!isFinite(v))return;v=Math.min(300,Math.max(30,v));play.bpm=v;var r=document.getElementById('tempo'),n=document.getElementById('bpmi');if(r&&src!=='slider')r.value=v;if(n&&src!=='input')n.value=v}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2400)}
function slug(s){return (s||'tutorial').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'tutorial'}

/* beat math: "1".."8" sit on the beat, "&"/"a" is a swung offbeat after the previous count */
function beats(steps){var out=[],last=-1;steps.forEach(function(s){var n=parseInt(s.count,10);var b=isNaN(n)?last+0.67:n-1;if(!isNaN(n))last=n-1;out.push(b)});return out}

function current(){return tuts.find(function(t){return t.id===sel})||null}

function renderList(){
  var cats={};tuts.forEach(function(t){if(t.rhythm)cats[t.rhythm]=1});
  var opts=['All'].concat(Object.keys(cats).sort());
  if(opts.indexOf(filter)<0)filter='All';
  $('filters').innerHTML=opts.map(function(o){return '<button class="chip" aria-pressed="'+(o===filter)+'" data-f="'+esc(o)+'">'+esc(o)+'</button>'}).join('');
  var q=query.toLowerCase();
  var vis=tuts.filter(function(t){
    if(filter!=='All'&&(t.rhythm||'Other')!==filter)return false;
    if(!q)return true;
    return JSON.stringify([t.title,t.category,t.summary,t.tips,t.steps]).toLowerCase().indexOf(q)>-1});
  if(!ready){$('list').innerHTML='';return}
  if(!vis.length){$('list').innerHTML='<p class="note">'+(tuts.length?'No tutorial matches that search.':'No tutorials yet.')+'</p>';return}
  var groups={};vis.forEach(function(t){var g=t.category||'Uncategorised';(groups[g]=groups[g]||[]).push(t)});
  $('list').innerHTML=Object.keys(groups).map(function(g){
    return '<div class="group">'+esc(g)+'</div>'+groups[g].map(function(t){
      return '<button class="item" data-id="'+esc(t.id)+'" aria-current="'+(t.id===sel)+'"><b>'+esc(t.title)+'</b><span class="tag'+(/8/.test(t.rhythm||'')?' eight':'')+'">'+esc(t.rhythm||'–')+'</span><small>'+esc([t.position,t.level].filter(Boolean).join(' · '))+'</small></button>'}).join('')}).join('');
  $('countInfo').textContent=tuts.length+' tutorial'+(tuts.length===1?'':'s');
}

// Reference video: YouTube and Vimeo links play inline, other links open in a new tab.
function ytEmbed(u){
  var m=String(u).match(/^https?:\/\/(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(!m)return null;
  var q=String(u).match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?\b/),st=q?(+(q[1]||0))*3600+(+(q[2]||0))*60+(+q[3]||0):0;
  return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&modestbranding=1&playsinline=1'+(st?'&start='+st:'');
}
// Vimeo: vimeo.com/ID, vimeo.com/ID/HASH (unlisted), player.vimeo.com/video/ID?h=HASH, optional #t=1m5s
function vimeoEmbed(u){
  u=String(u);
  var m=u.match(/^https?:\/\/(?:www\.)?(?:player\.)?vimeo\.com\/(?:video\/|(?:channels\/[\w-]+|groups\/[\w-]+\/videos|showcase\/\d+\/video)\/)?(\d+)(?:\/([0-9a-f]{6,}))?/i);
  if(!m)return null;
  var h=m[2]||((u.match(/[?&]h=([0-9a-f]+)/i)||[])[1]),q=u.match(/#t=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?/),
    st=q?(+(q[1]||0))*3600+(+(q[2]||0))*60+(+q[3]||0):0;
  return 'https://player.vimeo.com/video/'+m[1]+'?dnt=1&playsinline=1'+(h?'&h='+h:'')+(st?'#t='+st+'s':'');
}
// t.video is one URL or a list of URLs; each plays inline, numbered when there are several.
function videoHtml(t){
  var list=(Array.isArray(t.video)?t.video:[t.video]).filter(function(u){return u&&/^https?:\/\//.test(u)});
  return list.map(function(u,i){return oneVideoHtml(t,u,list.length>1?' '+(i+1):'')}).join('');
}
function oneVideoHtml(t,u,num){
  var e=ytEmbed(u),src='YouTube';
  if(!e){e=vimeoEmbed(u);src='Vimeo'}
  if(!e)return '<div><p class="label">Reference video'+num+'</p><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Open video ↗</a></div>';
  return '<div><p class="label">'+(t.category==='Video Recap'?'Lesson video':'Demo video')+num+'</p><div class="video"><iframe src="'+esc(e)+'" title="'+esc(t.title)+' video'+num+'" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><a class="note vlink" href="'+esc(u)+'" target="_blank" rel="noopener">Watch on '+src+' ↗</a></div>';
}
function renderView(){
  stop();
  var t=current(),m=$('main');
  if(!ready){return}
  if(!t){
    m.innerHTML='<section class="sheet"><div class="empty"><strong>'+(tuts.length?'Pick a move':'No tutorials yet')+'</strong><span>'+(tuts.length?'Choose a tutorial on the left to see its counts.':'Tutorials will appear here once they are added.')+'</span></div></section>';return}
  var steps=t.steps||[],tips=(t.tips||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
  var h='<section class="sheet"><div class="head-row"><div style="min-width:0;display:flex;flex-direction:column;gap:10px"><h2>'+esc(t.title)+'</h2><div class="meta">';
  [t.rhythm,t.position,t.level,t.category].filter(Boolean).forEach(function(x){h+='<span class="pill">'+esc(x)+'</span>'});
  h+='</div></div></div>';
  if(t.summary)h+='<p class="summary">'+esc(t.summary)+'</p>';
  if(steps.length){
    h+='<div><p class="label">Count player</p><div class="player"><div class="ctl"><button class="primary" id="pp">▶ Play</button><button id="nx">Next count</button><label for="tempo" class="note">Tempo</label><input type="range" id="tempo" min="40" max="180" step="1" value="'+play.bpm+'" aria-label="Tempo slider"><span class="bpm"><button class="stp" id="bpmd" aria-label="Slower by 1 BPM">−</button><input type="number" id="bpmi" min="30" max="300" step="1" inputmode="numeric" value="'+play.bpm+'" aria-label="Tempo in BPM"><button class="stp" id="bpmu" aria-label="Faster by 1 BPM">+</button>BPM</span></div>';
    h+='<div class="beats">'+steps.map(function(s,k){return '<button class="beat'+(isNaN(parseInt(s.count,10))?' amp':'')+'" data-k="'+k+'" aria-label="Count '+esc(s.count)+'">'+esc(s.count)+'</button>'}).join('')+'</div>';
    h+=feetHtml()+'<div class="now"><div class="bigc" id="bigc">–</div><div><div class="who l">Leader</div><p id="nowL" class="note">Press play or tap a count.</p></div><div class="f"><div class="who f">Follower</div><p id="nowF" class="note"></p></div></div></div></div>';
    h+='<div><p class="label">Step sheet</p><div class="tbl"><table><thead><tr><th>Count</th><th class="l">Leader</th><th class="f">Follower</th></tr></thead><tbody>'+steps.map(function(s,k){return '<tr data-k="'+k+'"><td class="c">'+esc(s.count)+'</td><td>'+esc(s.leader)+'</td><td>'+esc(s.follower)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  }
  if(tips.length)h+='<div><p class="label">Tips</p><ul class="tips">'+tips.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  h+=videoHtml(t);
  h+='</section>';
  m.innerHTML=h;
  if(steps.length){
    $('pp').onclick=toggle;$('nx').onclick=function(){go((play.i+1)%steps.length)};
    $('tempo').oninput=function(e){setBpm(e.target.value,'slider')};
    $('bpmi').oninput=function(e){var v=Math.round(+e.target.value);if(e.target.value!==''&&v>=30&&v<=300)setBpm(v,'input')};
    $('bpmi').onchange=function(e){setBpm(e.target.value===''?play.bpm:e.target.value)};
    $('bpmi').onkeydown=function(e){if(e.key==='Enter')e.target.blur();if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setBpm(play.bpm+(e.key==='ArrowUp'?1:-1))}};
    $('bpmd').onclick=function(){setBpm(play.bpm-1)};$('bpmu').onclick=function(){setBpm(play.bpm+1)};
    m.querySelectorAll('.beat').forEach(function(b){b.onclick=function(){go(+b.dataset.k)}});
    drawFeet(-1);
  }
}
function go(k){
  var t=current();if(!t)return;var s=t.steps[k];play.i=k;
  $('bigc').textContent=s.count;$('nowL').textContent=s.leader||'—';$('nowL').className='';$('nowF').textContent=s.follower||'—';
  document.querySelectorAll('.beat').forEach(function(b){b.classList.toggle('on',+b.dataset.k===k)});
  document.querySelectorAll('tbody tr').forEach(function(r){r.classList.toggle('on',+r.dataset.k===k)});
  drawFeet(k);
}

/* footprints: each count stores which foot steps and where, relative to that foot's home spot */
var DIRS={place:[0,0],back:[0,40],fwd:[0,-40],left:[-30,0],right:[30,0],bl:[-24,32],br:[24,32],fl:[-24,-32],fr:[24,-32]};
var DIRL={place:'In place',back:'Back',fwd:'Forward',left:'Left',right:'Right',bl:'Back left',br:'Back right',fl:'Fwd left',fr:'Fwd right'};
var TURNS={'0':'No turn','-45':'⅛ turn left','45':'⅛ turn right','-90':'¼ turn left','90':'¼ turn right','180':'½ turn'};
var HOME={L:[78,105],R:[122,105]};
function footOf(s,k,role){var d=s&&s[role==='l'?'lf':'ff'];if(d&&d.foot)return {foot:d.foot,dir:d.dir||'place',turn:+d.turn||0};
  var even=k%2===0;return {foot:role==='l'?(even?'L':'R'):(even?'R':'L'),dir:k===0?'back':'place',turn:0}}
function feetHtml(){
  function panel(role,name){var g='';
    ['L','R'].forEach(function(f){g+='<g class="foot" id="ft-'+role+'-'+f+'"><ellipse id="fb-'+role+'-'+f+'" cx="0" cy="5" rx="15" ry="27" stroke-width="1"/><ellipse id="fh-'+role+'-'+f+'" cx="0" cy="-24" rx="12" ry="9" stroke-width="1"/><text id="fx-'+role+'-'+f+'" x="0" y="10" text-anchor="middle" style="font:700 12px var(--mono);fill:var(--muted)">'+f+'</text></g>'});
    return '<div class="fp"><div class="who '+(role==='l'?'l':'f')+'">'+name+'</div><svg viewBox="0 0 200 190" role="img" aria-label="'+name+' footprints"><rect x="6" y="20" width="188" height="162" rx="10" fill="var(--sunk)"/><text x="100" y="13" text-anchor="middle" style="font:500 10px var(--body);fill:var(--muted)">Partner this way ↑</text>'+
      '<g fill="none" stroke="var(--line)" stroke-dasharray="3 3"><ellipse cx="78" cy="110" rx="15" ry="27"/><ellipse cx="122" cy="110" rx="15" ry="27"/></g>'+g+'</svg><div class="fd" id="fd-'+role+'">Home</div></div>'}
  return '<div class="feet">'+panel('l','Leader')+panel('f','Follower')+'</div>'}
function drawFeet(k){
  var t=current();if(!t||!document.getElementById('fd-l'))return;var st=t.steps||[];
  ['l','f'].forEach(function(role){
    var pos={L:[HOME.L[0],HOME.L[1],0],R:[HOME.R[0],HOME.R[1],0]},act=null;
    for(var j=0;j<=k&&j<st.length;j++){var d=footOf(st[j],j,role),o=DIRS[d.dir]||[0,0];pos[d.foot]=[HOME[d.foot][0]+o[0],HOME[d.foot][1]+o[1],d.turn];act=d}
    ['L','R'].forEach(function(f){var p=pos[f],on=act&&act.foot===f;
      $('ft-'+role+'-'+f).setAttribute('transform','translate('+p[0]+','+p[1]+') rotate('+p[2]+')');
      var col=role==='l'?'var(--lead)':'var(--follow)';
      ['fb','fh'].forEach(function(x){var e=$(x+'-'+role+'-'+f);e.setAttribute('fill',on?col:'var(--surface)');e.setAttribute('fill-opacity',on?'0.85':'1');e.setAttribute('stroke',on?col:'var(--muted)')});
      $('fx-'+role+'-'+f).style.fill=on?'var(--surface)':'var(--muted)'});
    $('fd-'+role).textContent=act?(act.foot+' · '+DIRL[act.dir]+(act.turn?' · '+TURNS[String(act.turn)]:'')):'Home';
  })}
function toggle(){if(play.t){stop()}else{play.t=1;$('pp').textContent='❚❚ Pause';tick()}}
function tick(){
  var t=current();if(!play.t||!t)return;var st=t.steps,b=beats(st);
  var k=(play.i+1)%st.length;go(k);
  var total=Math.floor(Math.max.apply(null,b))+1;var nb=k+1<st.length?b[k+1]:total;
  play.t=setTimeout(tick,Math.max(0.2,nb-b[k])*60000/play.bpm);
}
function stop(){if(play.t&&play.t!==1)clearTimeout(play.t);play.t=null;play.i=-1;var p=$('pp');if(p)p.textContent='▶ Play'}

/* events */
$('list').addEventListener('click',function(e){var b=e.target.closest('.item');if(!b)return;sel=b.dataset.id;renderList();renderView();
  if(window.matchMedia('(max-width:820px)').matches){var a=$('list').querySelector('[aria-current="true"]');if(a)a.scrollIntoView({block:'nearest',inline:'nearest'})}});
$('filters').addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;filter=b.dataset.f;renderList()});
$('q').addEventListener('input',function(e){query=e.target.value;renderList()});

/* boot: inside a claude.ai artifact the tutorials live in the artifact's db;
   anywhere else (your own server) they come from this app's /api/tutorials */
function received(list){
  tuts=list.map(function(x){x=Object.assign({},x);x.steps=(x.steps||[]).slice();return x})
    .sort(function(a,b){return (a.order||0)-(b.order||0)});
  var first=!ready;ready=true;
  if(first&&!sel&&tuts.length)sel=tuts[0].id;
  if(sel&&!current())sel=null;
  renderList();renderView();
}
async function load(){var r=await fetch('api/tutorials',{cache:'no-store'});if(!r.ok)throw new Error('failed');return r.json()}
(async function(){
  var c=window.claude;
  if(!c||!c.use){try{received(await load())}catch(e){fail()}return}
  var db=await c.use('db');
  if(!db){fail();return}
  db.collection('tutorials').orderBy('order').onSnapshot(function(snap){
    received(snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x}));
  },function(){fail()});
})();
function fail(){ready=true;$('countInfo').textContent='';$('main').innerHTML='<section class="sheet"><div class="empty"><strong>Tutorials not available</strong><span>The tutorials could not be loaded. Check that the server is running, then reload the page.</span></div></section>';renderList()}
})();
</script>
