<title>Lindy Hop Basics for Fellas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Look: a 1920s–30s Harlem ballroom dance programme. Cream card stock, ink, oxblood and brass,
   Art Deco rules and corners. Dark mode is the ballroom after hours: black lacquer and gold.
   Layout: library list on the left, a count-by-count step sheet on the right; stacks on phones. */
:root{
  --bg:#EFE4CC; --surface:#FAF4E4; --sunk:#E6D8B8; --ink:#231A12; --muted:#6B5A45; --line:#C9B48C;
  --brass:#A87A24; --brass-soft:#F0DDB0; --brass-ink:#4E3608;
  --savoy:#8E2A22; --savoy-soft:#F1D7CC;
  --lead:#1F3A5F; --follow:#2E6046; --danger:#9B1C14;
  --grain:rgba(90,60,20,.07);
  --display:"Limelight","Playfair Display",Georgia,serif;
  --head:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lora",Georgia,"Times New Roman",serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:3px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13100C; --surface:#1C1712; --sunk:#262019; --ink:#F1E6CC; --muted:#B9A684; --line:#4A3D2A;
  --brass:#D9AE52; --brass-soft:#3A2D14; --brass-ink:#F2D68E;
  --savoy:#E07A68; --savoy-soft:#3A1E19; --lead:#9DB8DE; --follow:#8CC7A2; --danger:#F08A7E;
  --grain:rgba(217,174,82,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13100C; --surface:#1C1712; --sunk:#262019; --ink:#F1E6CC; --muted:#B9A684; --line:#4A3D2A;
  --brass:#D9AE52; --brass-soft:#3A2D14; --brass-ink:#F2D68E;
  --savoy:#E07A68; --savoy-soft:#3A1E19; --lead:#9DB8DE; --follow:#8CC7A2; --danger:#F08A7E;
  --grain:rgba(217,174,82,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--bg);
  background-image:radial-gradient(var(--grain) 1px,transparent 1.2px),radial-gradient(var(--grain) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:24px}

/* masthead: centred, between double rules, with a deco fan */
header.top{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  border-top:5px double var(--ink);border-bottom:5px double var(--ink);padding:18px 8px 16px;position:relative}
.fan{display:block;width:96px;height:30px;color:var(--brass)}
.brand .kicker{font-family:var(--head);font-style:italic;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--savoy);margin:0 0 6px}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,7vw,68px);line-height:1;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.brand h1 span{display:block;font-family:var(--head);font-style:italic;font-weight:700;text-transform:none;letter-spacing:.02em;font-size:.5em;color:var(--brass);margin-top:4px}
.brand p{margin:10px 0 0;color:var(--muted);font-size:14px;font-style:italic}
.brand p::before,.brand p::after{content:"\2726";color:var(--brass);font-style:normal;margin:0 .6em;font-size:.8em}
.tempo-strip{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

button,.btn{font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.06em;border-radius:var(--r);border:1px solid var(--ink);background:var(--surface);color:var(--ink);padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  box-shadow:2px 2px 0 var(--line)}
button:hover,.btn:hover{background:var(--brass-soft)}
button:active,.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible,a:focus-visible{outline:2px solid var(--savoy);outline-offset:2px}
button.primary{background:var(--savoy);color:#FAF4E4;border-color:var(--savoy)}
button.primary:hover{background:var(--savoy);filter:brightness(1.1)}
:root[data-theme="dark"] button.primary{color:#1C1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) button.primary{color:#1C1712}}
button.brass{background:var(--brass);color:#1E1500;border-color:var(--brass)}
button.ghost{background:transparent;box-shadow:none}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button:disabled{opacity:.5;cursor:default}

.grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
aside{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){aside{position:static}}
.search{width:100%;font:inherit;font-style:italic;padding:9px 4px;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);box-shadow:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sections .chip{text-transform:none;letter-spacing:.02em;font-size:13px}
#sections .chip[aria-pressed="true"]{background:var(--savoy);border-color:var(--savoy)}

/* the library reads like a dance card */
.list{display:flex;flex-direction:column;gap:2px;max-height:62vh;overflow:auto;padding-right:2px}
@media (max-width:820px){.list{max-height:none}}
.group{font-family:var(--head);font-style:italic;font-size:15px;font-weight:700;color:var(--savoy);margin:14px 0 4px;display:flex;align-items:center;gap:10px}
.group::after{content:"";flex:1;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 12px;border-radius:var(--r);border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;width:100%;font-family:var(--body);font-weight:400;letter-spacing:0;box-shadow:none}
.item:hover{background:var(--sunk);border-color:transparent}
.item[aria-current="true"]{background:var(--surface);border-color:var(--ink);box-shadow:3px 3px 0 var(--brass)}
.item b{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item small{grid-column:1/-1;color:var(--muted);font-size:12px;font-style:italic}
.tag{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--r);border:1px solid var(--brass);background:var(--brass-soft);color:var(--brass-ink);align-self:start}
.tag.eight{background:var(--savoy-soft);color:var(--savoy);border-color:var(--savoy)}

/* the step sheet: a programme page with a double frame and deco corners */
main{min-width:0}
.sheet{position:relative;background:var(--surface);border:1px solid var(--ink);border-radius:var(--r);
  outline:1px solid var(--line);outline-offset:-8px;
  box-shadow:6px 6px 0 var(--sunk);
  padding:clamp(22px,3.4vw,38px);display:flex;flex-direction:column;gap:24px;min-width:0}
.sheet::before,.sheet::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--brass);pointer-events:none}
.sheet::before{top:14px;left:14px;border-right:0;border-bottom:0}
.sheet::after{bottom:14px;right:14px;border-left:0;border-top:0}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.8vw,48px);line-height:1.05;margin:0;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 10px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--muted)}
.summary{margin:0;max-width:65ch;color:var(--ink);font-size:16px}
.summary::first-letter{font-family:var(--display);float:left;font-size:3.1em;line-height:.85;padding:6px 4px 0 0;color:var(--savoy)}
.head-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.label{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--savoy);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.label::before{content:"\2766";letter-spacing:0;color:var(--brass);font-size:15px}
.label::after{content:"";flex:1;border-top:1px solid var(--line);max-width:240px}

/* demo video: framed like a newsreel */
.video{position:relative;width:100%;max-width:720px;aspect-ratio:16/9;border-radius:0;overflow:hidden;background:#000;border:6px solid var(--ink);box-shadow:0 0 0 1px var(--brass),4px 4px 0 1px var(--line)}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0;filter:sepia(.15)}
.video video{object-fit:contain;background:#000}
.video.portrait{aspect-ratio:9/16;max-width:min(360px,100%)}
.vlink{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);font-style:italic}

/* count player */
.player{border:1px solid var(--ink);border-radius:var(--r);background:var(--sunk);padding:16px;display:flex;flex-direction:column;gap:14px}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--savoy)}
.bpm{font-family:var(--mono);font-size:13px;font-weight:700;min-width:70px;display:inline-flex;align-items:center;gap:4px}
.bpm input{font:inherit;width:3.6em;text-align:center;padding:6px 2px;border:1px solid var(--ink);border-radius:var(--r);background:var(--surface);color:var(--ink);-moz-appearance:textfield}
.bpm input::-webkit-inner-spin-button,.bpm input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.bpm .stp{min-width:32px;padding:6px 0;justify-content:center}
.beats{display:flex;gap:6px;flex-wrap:wrap}
.beat{font-family:var(--display);font-weight:400;font-size:18px;min-width:40px;height:40px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--ink);background:var(--surface);color:var(--muted);padding:0 6px;cursor:pointer;box-shadow:none;letter-spacing:0}
.beat.amp{min-width:28px;width:28px;height:28px;align-self:center;font-family:var(--head);font-size:13px;padding:0}
.beat.on{background:var(--savoy);border-color:var(--savoy);color:#FAF4E4}
.now{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.now{grid-template-columns:auto minmax(0,1fr)}.now .f{grid-column:2}}
.bigc{font-family:var(--display);font-weight:400;font-size:68px;line-height:.9;min-width:56px;color:var(--savoy)}
.who{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.who.l{color:var(--lead)} .who.f{color:var(--follow)}
.now p{margin:2px 0 0;font-size:14px}

/* footprints */
.feet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fp svg{width:100%;max-width:240px;align-self:center;display:block}
.fp .fd{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);text-align:center;min-height:18px}
.foot{transition:transform .16s ease-out}

/* steps table: ruled like a typed programme */
.tbl{overflow-x:auto;border-top:3px double var(--ink);border-bottom:3px double var(--ink)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px dotted var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--head);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;background:transparent;border-bottom:1px solid var(--ink)}
td.c{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;width:56px;color:var(--savoy);text-align:center}
tr.on td{background:var(--brass-soft)}
tr.on td.c{color:var(--brass-ink)}
th.l{color:var(--lead)} th.f{color:var(--follow)}
.tips{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.tips li{position:relative;padding-left:24px}
.tips li::before{content:"\2726";position:absolute;left:2px;top:0;color:var(--brass)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;font-style:italic}
.empty strong{font-family:var(--display);font-weight:400;font-style:normal;font-size:30px;color:var(--ink);text-transform:uppercase}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.bar .sp{flex:1}
.note{font-size:13px;color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--r);font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.04em;z-index:10;box-shadow:3px 3px 0 var(--brass)}

/* phones: moves become a swipeable row, the step sheet stacks, controls get thumb-sized */
@media (max-width:820px){
  body{padding-block:14px 36px}
  .wrap{gap:16px}
  header.top{padding:14px 4px 12px;gap:6px}
  .fan{width:72px;height:22px}
  .brand p{font-size:13px}
  .grid{gap:16px}
  aside{gap:10px}
  .list{flex-direction:row;overflow-x:auto;gap:8px;max-height:none;padding:2px 6px 8px 2px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  #sections{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}#sections::-webkit-scrollbar{display:none}#sections .chip{flex:none;white-space:nowrap}
  .group{display:none}
  .list .note{white-space:nowrap}
  .item{flex:0 0 auto;width:auto;max-width:72vw;min-width:150px;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);padding:10px 12px;min-height:56px}
  .item b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item small{white-space:nowrap}
  .item[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--savoy)}
  .search{font-size:16px;padding:10px 4px}
  .chip{padding:6px 12px;font-size:13px}
}
@media (max-width:560px){
  .sheet{padding:22px 18px;gap:20px;outline-offset:-6px;box-shadow:4px 4px 0 var(--sunk)}
  .sheet::before{top:10px;left:10px;width:18px;height:18px}
  .sheet::after{bottom:10px;right:10px;width:18px;height:18px}
  .sheet h2{font-size:32px}
  .player{padding:12px;gap:12px}
  .ctl{gap:8px}
  .ctl button{min-height:44px;flex:1 1 40%;justify-content:center}
  .ctl label{order:3}
  .ctl input[type=range]{order:4;flex:1 1 0;min-width:0;height:32px}
  .bpm{order:5;text-align:right}
  .ctl .bpm .stp{flex:0 0 auto;min-width:44px;min-height:44px}
  .bpm input{min-height:44px;font-size:16px}
  .beats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
  .beat{min-width:0;width:auto;height:auto;aspect-ratio:1;max-height:48px;font-size:16px}
  .beat.amp{min-width:0;width:auto;height:auto;aspect-ratio:1;font-size:12px}
  .feet{gap:8px}
  .fp{padding:8px 6px 6px}
  .now{grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
  .now .f{grid-column:2}
  .bigc{font-size:54px;min-width:44px}
  .tbl{border:0;overflow:visible}
  table{min-width:0;font-size:14px}
  table,tbody,tr,td{display:block}
  thead{display:none}
  tbody{display:flex;flex-direction:column;gap:8px}
  tr{display:grid;grid-template-columns:44px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
  td{border:0;padding:8px 12px 8px 0}
  td.c{grid-row:1/3;width:auto;display:grid;place-items:center;padding:0;background:var(--sunk);font-size:20px}
  td:nth-child(2){padding-left:12px;padding-bottom:2px}
  td:nth-child(3){padding-left:12px;padding-top:2px;border-top:1px dotted var(--line)}
  td:nth-child(2)::before,td:nth-child(3)::before{display:block;font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
  td:nth-child(2)::before{content:"Leader";color:var(--lead)}
  td:nth-child(3)::before{content:"Follower";color:var(--follow)}
  tr.on{border-color:var(--savoy)}
  .tips{font-size:15px}
}
/* library / practice room switch */
.modes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modes button{font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:7px 16px}
.modes button[aria-current="true"]{background:var(--ink);color:var(--bg);box-shadow:2px 2px 0 var(--brass)}
#practice{display:flex;flex-direction:column;gap:18px;max-width:940px;margin:0 auto;width:100%;min-width:0}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ptabs .chip{font-size:13px;padding:7px 16px}
.toggles{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip:disabled{opacity:.45;cursor:default}
.tg{text-transform:none;letter-spacing:.02em;font-size:13px}
.tg[aria-pressed="true"]::before{content:"\2713\00a0"}
.callbox{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;border:1px solid var(--ink);background:var(--sunk);padding:18px;border-radius:var(--r)}
.callbox strong{display:block;font-family:var(--display);font-weight:400;font-size:clamp(22px,4vw,34px);line-height:1.1;text-transform:uppercase;overflow-wrap:anywhere;margin-top:2px}
.callbox .bigc{font-size:clamp(64px,12vw,110px);text-align:center;min-width:1.2em}
.callbox .r{text-align:right}
.callbox .r strong{color:var(--muted)}
.callbox .note{display:block}
@media (max-width:560px){.callbox{grid-template-columns:minmax(0,1fr) auto;padding:14px}.callbox .r{grid-column:1/-1;text-align:left;border-top:1px dotted var(--line);padding-top:8px}}
.cue{font-size:17px;margin:0;min-height:1.6em}
.cue b{font-family:var(--head);color:var(--lead);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.progress{height:6px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:var(--savoy);transition:width .4s linear}
span.beat{cursor:default}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.mv{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;min-width:0}
.mv input{accent-color:var(--savoy);margin-top:5px;flex:none}
.mv span{min-width:0}
.mv small{display:block;color:var(--muted);font-style:italic;font-size:12px}
.tapbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tap{min-width:150px;min-height:76px;justify-content:center;font-size:20px}
.tap.hit{background:var(--brass-soft)}
.tapv{font-family:var(--display);font-size:30px;color:var(--savoy);min-width:5em}
.blocks{display:flex;flex-direction:column;gap:6px;border:0;padding:0;margin:0;min-width:0}
.blk{display:grid;grid-template-columns:28px minmax(110px,150px) minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.blk.cur{border-color:var(--savoy);box-shadow:3px 3px 0 var(--brass)}
.blk.done{opacity:.55}
.blk select,.blk input,.sel{font:inherit;font-size:14px;padding:6px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.blk .mini{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.blk .mini input{width:4.4em}
.blk .acts{display:flex;gap:4px}

<script>
(function(){
var tuts=[],sel=null,filter='All',query='',ready=false,section='All';
try{section=localStorage.getItem('lh-section')||'All'}catch(e){}
var play={t:null,i:-1,bpm:70};
function setBpm(v,src){v=Math.round(+v);if(!isFinite(v))return;v=Math.min(300,Math.max(30,v));play.bpm=v;if(TR.owner==='player')TR.bpm=v;var r=document.getElementById('tempo'),n=document.getElementById('bpmi');if(r&&src!=='slider')r.value=v;if(n&&src!=='input')n.value=v}
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2400)}
function slug(s){return (s||'tutorial').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'tutorial'}

/* beat math: "1".."8" sit on the beat, "&"/"a" is a swung offbeat after the previous count */
function beats(steps){var out=[],last=-1;steps.forEach(function(s){var n=parseInt(s.count,10);var b=isNaN(n)?last+0.67:n-1;if(!isNaN(n))last=n-1;out.push(b)});return out}

// " · v5 · deployed 24 Nov, 10:05", from the server; empty when the page runs without it.
function versionLabel(){var a=window.APP_VERSION;if(!a||!a.version)return '';var s=' · v'+a.version,d=new Date(a.deployed);
  if(!isNaN(d))s+=' · deployed '+d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});return s}
function current(){return tuts.find(function(t){return t.id===sel})||null}

function renderList(){
  var cats={};tuts.forEach(function(t){if(t.rhythm)cats[t.rhythm]=1});
  var opts=['All'].concat(Object.keys(cats).sort());
  if(opts.indexOf(filter)<0)filter='All';
  $('filters').innerHTML=opts.map(function(o){return '<button class="chip" aria-pressed="'+(o===filter)+'" data-f="'+esc(o)+'">'+esc(o)+'</button>'}).join('');
  // Section buttons: one per category, in the order the sections appear in the library.
  var secs=[];tuts.forEach(function(t){var g=t.category||'Uncategorised';if(secs.indexOf(g)<0)secs.push(g)});
  if(section!=='All'&&secs.indexOf(section)<0)section='All';
  $('sections').innerHTML=(secs.length>1?['All sections'].concat(secs):[]).map(function(g){var v=g==='All sections'?'All':g;return '<button class="chip sec" aria-pressed="'+(v===section)+'" data-s="'+esc(v)+'">'+esc(g)+'</button>'}).join('');
  var sb=$('sections'),on=sb.querySelector('[aria-pressed="true"]');if(on&&sb.scrollWidth>sb.clientWidth)sb.scrollLeft=Math.max(0,on.offsetLeft-sb.offsetLeft-16);
  var q=query.toLowerCase();
  var vis=tuts.filter(function(t){
    if(section!=='All'&&(t.category||'Uncategorised')!==section)return false;
    if(filter!=='All'&&(t.rhythm||'Other')!==filter)return false;
    if(!q)return true;
    return JSON.stringify([t.title,t.category,t.summary,t.tips,t.steps]).toLowerCase().indexOf(q)>-1});
  if(!ready){$('list').innerHTML='';return}
  if(!vis.length){$('list').innerHTML='<p class="note">'+(tuts.length?'No tutorial matches that search.':'No tutorials yet.')+'</p>';return}
  var groups={};vis.forEach(function(t){var g=t.category||'Uncategorised';(groups[g]=groups[g]||[]).push(t)});
  $('list').innerHTML=Object.keys(groups).map(function(g){
    return '<div class="group">'+esc(g)+'</div>'+groups[g].map(function(t){
      return '<button class="item" data-id="'+esc(t.id)+'" aria-current="'+(t.id===sel)+'"><b>'+esc(t.title)+'</b><span class="tag'+(/8/.test(t.rhythm||'')?' eight':'')+'">'+esc(t.rhythm||'–')+'</span><small>'+esc([t.position,t.level].filter(Boolean).join(' · '))+'</small></button>'}).join('')}).join('');
  $('countInfo').textContent=tuts.length+' tutorial'+(tuts.length===1?'':'s')+versionLabel();
}

// Reference video: YouTube and Vimeo links play inline, other links open in a new tab.
function ytEmbed(u){
  var m=String(u).match(/^https?:\/\/(?:www\.|m\.|music\.)?(?:youtube\.com\/(?:watch\?(?:[^#]*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(!m)return null;
  var q=String(u).match(/[?&#](?:t|start)=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?\b/),st=q?(+(q[1]||0))*3600+(+(q[2]||0))*60+(+q[3]||0):0;
  return 'https://www.youtube-nocookie.com/embed/'+m[1]+'?rel=0&modestbranding=1&playsinline=1'+(st?'&start='+st:'');
}
// Vimeo: vimeo.com/ID, vimeo.com/ID/HASH (unlisted), player.vimeo.com/video/ID?h=HASH, optional #t=1m5s
function vimeoEmbed(u){
  u=String(u);
  var m=u.match(/^https?:\/\/(?:www\.)?(?:player\.)?vimeo\.com\/(?:video\/|(?:channels\/[\w-]+|groups\/[\w-]+\/videos|showcase\/\d+\/video)\/)?(\d+)(?:\/([0-9a-f]{6,}))?/i);
  if(!m)return null;
  var h=m[2]||((u.match(/[?&]h=([0-9a-f]+)/i)||[])[1]),q=u.match(/#t=(?:(\d+)h)?(?:(\d+)m)?(\d+)s?/),
    st=q?(+(q[1]||0))*3600+(+(q[2]||0))*60+(+q[3]||0):0;
  return 'https://player.vimeo.com/video/'+m[1]+'?dnt=1&playsinline=1'+(h?'&h='+h:'')+(st?'#t='+st+'s':'');
}
// t.video is one URL or a list of URLs; each plays inline, numbered when there are several.
function videoHtml(t){
  var list=(Array.isArray(t.video)?t.video:[t.video]).filter(function(u){return u&&/^https?:\/\//.test(u)});
  return list.map(function(u,i){return oneVideoHtml(t,u,list.length>1?' '+(i+1):'')}).join('');
}
function oneVideoHtml(t,u,num){
  var e=ytEmbed(u),src='YouTube';
  if(!e){e=vimeoEmbed(u);src='Vimeo'}
  else{e+='&enablejsapi=1'+(location.origin&&location.origin!=='null'?'&origin='+encodeURIComponent(location.origin):'')}
  var lbl=(t.category==='Video Recap'?'Lesson video':'Demo video')+num,vid='vid'+(++vidN);
  // Lesson recaps are filmed on a phone, so they play in a 9:16 portrait frame.
  var vcls=t.category==='Video Recap'?'video portrait':'video';
  // Direct video files (e.g. Cloudinary .mp4) play in a native <video> player.
  if(!e&&/\.(mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i.test(u))return '<div><p class="label">'+lbl+'</p><div class="'+vcls+'"><video id="'+vid+'" src="'+esc(u)+'" controls playsinline preload="metadata" title="'+esc(t.title)+' video'+num+'"></video></div>'+vctlHtml(vid)+'<a class="note vlink" href="'+esc(u)+'" target="_blank" rel="noopener">Open video file ↗</a></div>';
  if(!e)return '<div><p class="label">Reference video'+num+'</p><a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Open video ↗</a></div>';
  return '<div><p class="label">'+lbl+'</p><div class="'+vcls+'"><iframe id="'+vid+'" src="'+esc(e)+'" title="'+esc(t.title)+' video'+num+'" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>'+vctlHtml(vid)+'<a class="note vlink" href="'+esc(u)+'" target="_blank" rel="noopener">Watch on '+src+' ↗</a></div>';
}
function renderView(){
  stop();vreset();
  var t=current(),m=$('main');
  if(!ready){return}
  if(!t){
    m.innerHTML='<section class="sheet"><div class="empty"><strong>'+(tuts.length?'Pick a move':'No tutorials yet')+'</strong><span>'+(tuts.length?'Choose a tutorial on the left to see its counts.':'Tutorials will appear here once they are added.')+'</span></div></section>';return}
  var steps=t.steps||[],tips=(t.tips||'').split('\n').map(function(s){return s.trim()}).filter(Boolean);
  var h='<section class="sheet"><div class="head-row"><div style="min-width:0;display:flex;flex-direction:column;gap:10px"><h2>'+esc(t.title)+'</h2><div class="meta">';
  [t.rhythm,t.position,t.level,t.category].filter(Boolean).forEach(function(x){h+='<span class="pill">'+esc(x)+'</span>'});
  h+='</div></div></div>';
  if(t.summary)h+='<p class="summary">'+esc(t.summary)+'</p>';
  if(steps.length){
    h+='<div><p class="label">Count player</p><div class="player"><div class="ctl"><button class="primary" id="pp">▶ Play</button><button id="nx">Next count</button><label for="tempo" class="note">Tempo</label><input type="range" id="tempo" min="40" max="180" step="1" value="'+play.bpm+'" aria-label="Tempo slider"><span class="bpm"><button class="stp" id="bpmd" aria-label="Slower by 1 BPM">−</button><input type="number" id="bpmi" min="30" max="300" step="1" inputmode="numeric" value="'+play.bpm+'" aria-label="Tempo in BPM"><button class="stp" id="bpmu" aria-label="Faster by 1 BPM">+</button>BPM</span></div>';
    h+='<div class="toggles">'+tg('click','Click')+tg('countin','5-6-7-8 lead-in')+tg('music','Music')+'</div>';
    h+='<div class="toggles"><span class="note">Voice</span>'+[['off','Off'],['counts','Counts'],['steps','Rock step / triple step']].map(function(v){return '<button class="chip tg" data-voice="'+v[0]+'" aria-pressed="'+(PREF.voice===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>';
    h+='<div class="beats">'+steps.map(function(s,k){return '<button class="beat'+(isNaN(parseInt(s.count,10))?' amp':'')+'" data-k="'+k+'" aria-label="Count '+esc(s.count)+'">'+esc(s.count)+'</button>'}).join('')+'</div>';
    h+=feetHtml()+'<div class="now"><div class="bigc" id="bigc">–</div><div><div class="who l">Leader</div><p id="nowL" class="note">Press play or tap a count.</p></div><div class="f"><div class="who f">Follower</div><p id="nowF" class="note"></p></div></div></div></div>';
    h+='<div><p class="label">Step sheet</p><div class="tbl"><table><thead><tr><th>Count</th><th class="l">Leader</th><th class="f">Follower</th></tr></thead><tbody>'+steps.map(function(s,k){return '<tr data-k="'+k+'"><td class="c">'+esc(s.count)+'</td><td>'+esc(s.leader)+'</td><td>'+esc(s.follower)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  }
  if(tips.length)h+='<div><p class="label">Tips</p><ul class="tips">'+tips.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  h+=videoHtml(t);
  h+='</section>';
  m.innerHTML=h;
  if(steps.length){
    $('pp').onclick=toggle;$('nx').onclick=function(){go((play.i+1)%steps.length)};
    $('tempo').oninput=function(e){setBpm(e.target.value,'slider')};
    $('bpmi').oninput=function(e){var v=Math.round(+e.target.value);if(e.target.value!==''&&v>=30&&v<=300)setBpm(v,'input')};
    $('bpmi').onchange=function(e){setBpm(e.target.value===''?play.bpm:e.target.value)};
    $('bpmi').onkeydown=function(e){if(e.key==='Enter')e.target.blur();if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();setBpm(play.bpm+(e.key==='ArrowUp'?1:-1))}};
    $('bpmd').onclick=function(){setBpm(play.bpm-1)};$('bpmu').onclick=function(){setBpm(play.bpm+1)};
    m.querySelectorAll('.beat').forEach(function(b){b.onclick=function(){go(+b.dataset.k)}});
    drawFeet(-1);
  }
}
function go(k){
  var t=current();if(!t)return;var s=t.steps[k];play.i=k;
  $('bigc').textContent=s.count;$('nowL').textContent=s.leader||'—';$('nowL').className='';$('nowF').textContent=s.follower||'—';
  document.querySelectorAll('.beat').forEach(function(b){b.classList.toggle('on',+b.dataset.k===k)});
  document.querySelectorAll('tbody tr').forEach(function(r){r.classList.toggle('on',+r.dataset.k===k)});
  drawFeet(k);
}

/* footprints: each count stores which foot steps and where, relative to that foot's home spot */
var DIRS={place:[0,0],back:[0,40],fwd:[0,-40],left:[-30,0],right:[30,0],bl:[-24,32],br:[24,32],fl:[-24,-32],fr:[24,-32]};
var DIRL={place:'In place',back:'Back',fwd:'Forward',left:'Left',right:'Right',bl:'Back left',br:'Back right',fl:'Fwd left',fr:'Fwd right'};
var TURNS={'0':'No turn','-45':'⅛ turn left','45':'⅛ turn right','-90':'¼ turn left','90':'¼ turn right','180':'½ turn'};
var HOME={L:[78,105],R:[122,105]};
function footOf(s,k,role){var d=s&&s[role==='l'?'lf':'ff'];if(d&&d.foot)return {foot:d.foot,dir:d.dir||'place',turn:+d.turn||0};
  var even=k%2===0;return {foot:role==='l'?(even?'L':'R'):(even?'R':'L'),dir:k===0?'back':'place',turn:0}}
function feetHtml(){
  function panel(role,name){var g='';
    ['L','R'].forEach(function(f){g+='<g class="foot" id="ft-'+role+'-'+f+'"><ellipse id="fb-'+role+'-'+f+'" cx="0" cy="5" rx="15" ry="27" stroke-width="1"/><ellipse id="fh-'+role+'-'+f+'" cx="0" cy="-24" rx="12" ry="9" stroke-width="1"/><text id="fx-'+role+'-'+f+'" x="0" y="10" text-anchor="middle" style="font:700 12px var(--mono);fill:var(--muted)">'+f+'</text></g>'});
    return '<div class="fp"><div class="who '+(role==='l'?'l':'f')+'">'+name+'</div><svg viewBox="0 0 200 190" role="img" aria-label="'+name+' footprints"><rect x="6" y="20" width="188" height="162" rx="10" fill="var(--sunk)"/><text x="100" y="13" text-anchor="middle" style="font:500 10px var(--body);fill:var(--muted)">Partner this way ↑</text>'+
      '<g fill="none" stroke="var(--line)" stroke-dasharray="3 3"><ellipse cx="78" cy="110" rx="15" ry="27"/><ellipse cx="122" cy="110" rx="15" ry="27"/></g>'+g+'</svg><div class="fd" id="fd-'+role+'">Home</div></div>'}
  return '<div class="feet">'+panel('l','Leader')+panel('f','Follower')+'</div>'}
function drawFeet(k){
  var t=current();if(!t||!document.getElementById('fd-l'))return;var st=t.steps||[];
  ['l','f'].forEach(function(role){
    var pos={L:[HOME.L[0],HOME.L[1],0],R:[HOME.R[0],HOME.R[1],0]},act=null;
    for(var j=0;j<=k&&j<st.length;j++){var d=footOf(st[j],j,role),o=DIRS[d.dir]||[0,0];pos[d.foot]=[HOME[d.foot][0]+o[0],HOME[d.foot][1]+o[1],d.turn];act=d}
    ['L','R'].forEach(function(f){var p=pos[f],on=act&&act.foot===f;
      $('ft-'+role+'-'+f).setAttribute('transform','translate('+p[0]+','+p[1]+') rotate('+p[2]+')');
      var col=role==='l'?'var(--lead)':'var(--follow)';
      ['fb','fh'].forEach(function(x){var e=$(x+'-'+role+'-'+f);e.setAttribute('fill',on?col:'var(--surface)');e.setAttribute('fill-opacity',on?'0.85':'1');e.setAttribute('stroke',on?col:'var(--muted)')});
      $('fx-'+role+'-'+f).style.fill=on?'var(--surface)':'var(--muted)'});
    $('fd-'+role).textContent=act?(act.foot+' · '+DIRL[act.dir]+(act.turn?' · '+TURNS[String(act.turn)]:'')):'Home';
  })}
/* count player: runs on the shared audio clock, so clicks, spoken counts and the step display stay in time */
function toggle(){if(play.t)trStop();else startPlayer()}
function startPlayer(){
  var t=current();if(!t||!(t.steps||[]).length)return;var st=t.steps,info=moveInfo(t);
  var ok=trStart(play.bpm,function(beat,time,spb){
    if(PREF.music)groove(beat,time,spb,bandStyle());
    if(beat<0){var n=beat+9;SND.click(time,n===5?'rock':'beat');say(WORDS[n],time,1.5);
      at(time,function(){if(!$('bigc'))return;$('bigc').textContent=n;$('nowL').textContent='Get ready…';$('nowL').className='note';$('nowF').textContent=''});return}
    var pos=beat%info.len;
    info.b.forEach(function(bb,k){if(Math.floor(bb+1e-6)!==pos)return;var tt=time+(bb-pos)*spb,n=parseInt(st[k].count,10);
      if(PREF.click)SND.click(tt,info.acc[k]);
      if(PREF.voice==='counts'&&!isNaN(n))say(WORDS[n]||String(n),tt,1.6);
      if(PREF.voice==='steps'&&info.names[k])say(info.names[k],tt,Math.max(1.3,Math.min(2.2,play.bpm/80)));
      at(tt,function(){if(current()===t&&$('bigc'))go(k)})});
  },PREF.countin?4:0,'player');
  if(!ok)return;play.t=1;$('pp').textContent='❚❚ Pause';
  TR.onstop=function(){play.t=null;play.i=-1;var p=$('pp');if(p)p.textContent='▶ Play'};
}
function stop(){if(TR.owner==='player')trStop();play.t=null;play.i=-1;var p=$('pp');if(p)p.textContent='▶ Play'}

/* ===== sound: one Web Audio clock drives the count player, the groove, the caller and sessions ===== */
var WORDS=['','one','two','three','four','five','six','seven','eight'];
var AU={ctx:null,master:null,bus:null,noise:null};
function ac(){
  if(!AU.ctx){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    var c=AU.ctx=new C(),comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
    AU.master=c.createGain();AU.master.gain.value=.9;AU.master.connect(comp);
    var n=c.sampleRate,b=c.createBuffer(1,n,n),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;AU.noise=b}
  try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  if(AU.ctx.state!=='running')AU.ctx.resume();
  return AU.ctx}
function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function out(){return AU.bus||AU.master}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec)}
function tone(t,f,type,peak,dec,dest,att){var c=AU.ctx,o=c.createOscillator(),g=c.createGain();att=att||.004;o.type=type;o.frequency.setValueAtTime(f,t);env(g,t,peak,att,dec);o.connect(g);g.connect(dest||out());o.start(t);o.stop(t+att+dec+.05)}
function noise(t,peak,dec,ft,freq,q){var c=AU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.noise;f.type=ft;f.frequency.value=freq;if(q)f.Q.value=q;env(g,t,peak,.002,dec);s.connect(f);f.connect(g);g.connect(out());s.start(t,Math.random()*.5);s.stop(t+dec+.05)}
var SND={
  // k: 'one' (count 1) | 'rock' (start of a rock step) | 'beat' | 'off' (swung "&")
  click:function(t,k){var f={one:1760,rock:1320,beat:990,off:740}[k]||990,v={one:.5,rock:.42,beat:.28,off:.15}[k]||.28;tone(t,f,'square',v*.45,.03);tone(t,f*2,'sine',v*.35,.02)},
  kick:function(t,v){var c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(g,t,v,.003,.16);o.connect(g);g.connect(out());o.start(t);o.stop(t+.25)},
  brush:function(t,v){noise(t,v,.14,'bandpass',2600,.7)},

function parsePos(s){var a=String(s||'').split(/→|->/).map(function(x){return x.trim()}).filter(Boolean);return a.length?[a[0],a[a.length-1]]:[null,null]}

    var end=prev?prev.to:null;
    if(prev&&o.basics()&&!isBasic(prev)){var b=basics.find(function(m){return m.from===end});if(b)return b}
    var c=moves.filter(function(m){return !end||!m.from||m.from===end}),jump=!c.length;if(jump)c=moves.slice();

  {name:'6-count vocabulary — 12 min',blocks:[{type:'drill',id:'send-out',min:2,bpm:120},{type:'drill',id:'bring-in',min:2,bpm:120},{type:'drill',id:'underarm-pass',min:2,bpm:125},{type:'caller',moves:'six',min:6,bpm:135}]},
  {name:'Charleston — 8 min',blocks:[{type:'drill',id:'8-count-basic-charleston',min:3,bpm:120},{type:'drill',id:'6-count-basic-charleston',min:2,bpm:120},{type:'free',label:'Charleston, free styling',min:3,bpm:150}]}
];
var MOVESETS={six:'6-count moves',eight:'8-count moves',all:'All moves',mine:'My caller picks'};
var SES={blocks:null,i:0,phase:'idle',k:0,relStart:0,runStart:0,done:0,sub:null,skip:false};
try{var sv=JSON.parse(localStorage.getItem('lh-session'));if(Array.isArray(sv)&&sv.length)SES.blocks=sv}catch(e){}
function saveSes(){try{localStorage.setItem('lh-session',JSON.stringify(SES.blocks))}catch(e){}}
function tutById(id){return tuts.find(function(t){return t.id===id})}
function presetBlocks(p){return JSON.parse(JSON.stringify(p.blocks)).filter(function(b){return b.type!=='drill'||tutById(b.id)})}
function blockName(b){if(b.type==='drill'){var t=tutById(b.id);return t?t.title:'Missing move'}if(b.type==='caller')return 'Combo caller · '+(MOVESETS[b.moves]||'All moves');return b.label||'Free dance'}
function blockSpoken(b){return b.type==='drill'?blockName(b).replace(/^\d+[- ]?count\s+/i,''):b.type==='caller'?'Combo caller':(b.label||'Free dance')}
function sesMoves(b){var pool=movePool();if(b.moves==='mine')return selectedMoves();
  return pool.filter(function(t){return b.moves==='all'||new RegExp(b.moves==='eight'?'8':'6').test(t.rhythm||'')}).map(mkMove)}
function sesTotal(){return SES.blocks.reduce(function(a,b){return a+(+b.min||0)},0)}
function makeSub(b){
  var t=b.type==='drill'&&tutById(b.id);
  if(t&&(t.steps||[]).length){var st=t.steps,info=moveInfo(t);
    return {boundary:function(rel){return rel%info.len===0},beat:function(rel,time,spb){var pos=rel%info.len;
      info.b.forEach(function(bb,k){if(Math.floor(bb+1e-6)!==pos)return;var tt=time+(bb-pos)*spb;if(PREF.sClick)SND.click(tt,info.acc[k]);if(PREF.sVoice&&info.names[k])say(info.names[k],tt,Math.max(1.3,Math.min(2.2,TR.bpm/80)));
        at(tt,function(){txt('s-cnt',st[k].count);var e=$('s-cue');if(e)e.innerHTML='<b>Leader</b>'+esc(st[k].leader||'')})})}}}
  if(b.type==='caller'){var mv=sesMoves(b);if(mv.length){
    var cal=makeCaller(mv,{click:function(){return PREF.sClick},voice:function(){return PREF.sVoice},basics:function(){return PREF.cBasics}},function(tt,cur,nxt,pos){at(tt,function(){txt('s-cnt',pos+1);
      var e=$('s-cue');if(e)e.innerHTML='<b>Now</b>'+esc(cur.title)+' &nbsp;<b>Next</b>'+esc(nxt.title)})});
    return {boundary:cal.boundary,beat:cal.beat,first:cal.prime}}}
  var len=t&&/6/.test(t.rhythm||'')?6:8;
  return {boundary:function(rel){return rel%len===0},beat:function(rel,time){var pos=rel%len;if(PREF.sClick)SND.click(time,pos===0?'one':'beat');
    at(time,function(){txt('s-cnt',pos+1);txt('s-cue',t?'Dance '+t.title+' along with the music.':(b.label||'Dance freely to the music.'))})}}
}
function sesFn(beat,t,spb){
  var b=SES.blocks[SES.i];
  if(PREF.sMusic)groove(beat,t,spb,bandStyle());
  if(SES.phase==='run'){
    var rel=beat-SES.relStart,el=SES.done+(t-SES.runStart);
    if(SES.skip||(el>=b.min*60&&SES.sub.boundary(rel))){
      SES.skip=false;SES.i++;SES.done=0;
      if(SES.i>=SES.blocks.length){SES.phase='idle';SES.i=0;at(t,function(){trStop();if(PREF.sVoice)sayNow('Session complete. Well danced!',1.1);sesFinished()});return}
      b=SES.blocks[SES.i];TR.bpm=+b.bpm||120;SES.phase='in';SES.k=4;SES.sub=null;
    }else{SES.sub.beat(rel,t,spb);var left=b.min*60-el,tot=left+SES.blocks.slice(SES.i+1).reduce(function(a,x){return a+x.min*60},0);
      at(t,function(){txt('s-left',fmt(left));txt('s-total','Session '+fmt(tot)+' left');var p=$('s-bar');if(p)p.style.width=Math.min(100,100*el/(b.min*60))+'%'});return}
  }
  // count-in: four beats, block name spoken on the first
  var n=4-SES.k;if(n===0){SES.sub=makeSub(b);
    if(PREF.sVoice)say((SES.started?'Next: ':'')+blockSpoken(b)+(b.type==='caller'&&SES.sub.first?'. '+SES.sub.first().name:''),t,1.15);SES.started=true}
  SND.click(t,n===0?'rock':'beat');
  var bi=SES.i;at(t,function(){sesHighlight(bi);txt('s-cnt',n+5);txt('s-name',blockName(b));txt('s-kind','Block '+(bi+1)+' of '+SES.blocks.length+' · '+b.bpm+' BPM');txt('s-cue','Get ready…');txt('s-left',fmt(b.min*60-SES.done))});
  SES.k--;if(SES.k===0){SES.phase='run';SES.relStart=beat+1;SES.runStart=t+spb}
}
function sesStart(){
  if(!SES.blocks.length){toast('Add a block first');return}
  var b=SES.blocks[SES.i];SES.phase='in';SES.k=4;SES.skip=false;SES.started=SES.i>0||SES.done>0;
  if(!trStart(+b.bpm||120,sesFn,0,'session'))return;
  goBtn('s',true);txt('s-go','❚❚ Pause');$('s-blocks').disabled=true;$('s-pre').disabled=true;
  TR.onstop=function(){if(SES.phase==='run'&&AU.ctx)SES.done+=Math.max(0,AU.ctx.currentTime-SES.runStart);if(SES.phase!=='idle')SES.phase='paused';
    txt('s-go',SES.phase==='paused'?'▶ Resume':'▶ Start');var f=$('s-blocks');if(f)f.disabled=false;if($('s-pre'))$('s-pre').disabled=false;if(SES.phase==='paused')txt('s-cue','Paused.')};
}
function sesFinished(){SES.done=0;SES.started=false;renderSession();txt('s-name','Session complete');txt('s-cue','Nice work. Pick another plan or run this one again.');var p=$('s-bar');if(p)p.style.width='100%'}
function sesHighlight(i){var f=$('s-blocks');if(!f)return;f.querySelectorAll('.blk').forEach(function(r,k){r.classList.toggle('cur',k===i);r.classList.toggle('done',k<i)})}
function blkRow(b,i){
  var what;
  if(b.type==='drill')what='<select class="what" data-f="id" aria-label="Move">'+tuts.filter(function(t){return (t.steps||[]).length}).map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===b.id?' selected':'')+'>'+esc(t.title)+'</option>'}).join('')+'</select>';
  else if(b.type==='caller')what='<select class="what" data-f="moves" aria-label="Moves">'+Object.keys(MOVESETS).map(function(k){return '<option value="'+k+'"'+(k===(b.moves||'all')?' selected':'')+'>'+MOVESETS[k]+'</option>'}).join('')+'</select>';
  else what='<input class="what" data-f="label" maxlength="60" placeholder="What to practise" value="'+esc(b.label||'')+'" aria-label="What to practise">';
  return '<div class="blk" data-i="'+i+'"><span class="bn">'+(i+1)+'</span><select class="ty" data-f="type" aria-label="Block type"><option value="drill"'+(b.type==='drill'?' selected':'')+'>Drill a move</option><option value="caller"'+(b.type==='caller'?' selected':'')+'>Combo caller</option><option value="free"'+(b.type==='free'?' selected':'')+'>Free dance</option></select>'+what+
    '<label class="mini"><input type="number" data-f="min" min="1" max="60" inputmode="numeric" value="'+b.min+'"> min</label><label class="mini"><input type="number" data-f="bpm" min="60" max="260" inputmode="numeric" value="'+b.bpm+'"> BPM</label>'+
    '<span class="acts"><button data-a="up" aria-label="Move block up"'+(i?'':' disabled')+'>↑</button><button data-a="down" aria-label="Move block down"'+(i<SES.blocks.length-1?'':' disabled')+'>↓</button><button data-a="del" aria-label="Remove block">✕</button></span></div>'}
function renderBlocks(){var f=$('s-blocks');if(!f)return;f.innerHTML=SES.blocks.map(blkRow).join('')+'<div class="toggles"><button class="chip" id="s-add">+ Add block</button><span class="note">Total '+sesTotal()+' min</span></div>';sesHighlight(SES.phase==='idle'&&!SES.done?-1:SES.i)}
function renderSession(){
  if(!SES.blocks)SES.blocks=presetBlocks(PRESETS[0]);
  if(SES.i>=SES.blocks.length){SES.i=0;SES.done=0;SES.phase='idle'}
  var b=SES.blocks[SES.i]||{min:0,bpm:120};
  var h='<section class="sheet"><h2>Practice Session</h2><p class="summary">A timed routine that walks you through blocks: drill one move to its counts, let the combo caller lead you, or dance freely. Each block counts you in, says what is next, and changes tempo for you. The screen stays awake while it runs.</p>';
  h+='<div class="callbox"><div><span class="who l" id="s-kind">'+(SES.blocks.length?'Block '+(SES.i+1)+' of '+SES.blocks.length:'No blocks')+'</span><strong id="s-name">'+esc(SES.blocks.length?blockName(b):'Add a block')+'</strong></div><div class="bigc" id="s-cnt">–</div><div class="r"><span class="who">Time left</span><strong id="s-left">'+fmt(b.min*60-SES.done)+'</strong><span class="note" id="s-total">Session '+sesTotal()+' min</span></div></div>';
  h+='<div class="progress"><span id="s-bar"></span></div><p class="cue" id="s-cue">'+(SES.phase==='paused'?'Paused.':'')+'</p>';
  h+='<div class="player"><div class="ctl"><button class="primary" id="s-go">'+(SES.phase==='paused'?'▶ Resume':'▶ Start')+'</button><button id="s-skip">Skip block</button><button id="s-reset">Restart</button></div><div class="toggles">'+tg('sVoice','Voice')+tg('sMusic','Music')+tg('sClick','Click')+'</div></div>';
  h+='<div><p class="label">Session plan</p><div class="toggles" style="margin-bottom:10px"><select class="sel" id="s-pre" style="width:auto;max-width:100%"><option value="">Load a ready-made plan…</option>'+PRESETS.map(function(p,i){return '<option value="'+i+'">'+esc(p.name)+'</option>'}).join('')+'</select></div>';
  h+='<fieldset class="blocks" id="s-blocks"></fieldset><p class="fine">Your plan is saved in this browser. Blocks end on the next full move after their time is up, so you never stop mid-swing-out.</p></div></section>';
  $('pbody').innerHTML=h;renderBlocks();
  $('s-go').onclick=function(){if(TR.owner==='session')trStop();else sesStart()};
  $('s-skip').onclick=function(){if(TR.owner==='session'){SES.skip=true;return}if(SES.i<SES.blocks.length-1){SES.i++;SES.done=0;SES.phase='paused';renderSession()}};
  $('s-reset').onclick=function(){trStop();SES.i=0;SES.done=0;SES.phase='idle';SES.started=false;renderSession()};
  $('s-pre').onchange=function(e){var p=PRESETS[+e.target.value];if(!p)return;SES.blocks=presetBlocks(p);SES.i=0;SES.done=0;SES.phase='idle';saveSes();renderSession();toast('Loaded “'+p.name+'”')};
  var f=$('s-blocks');
  f.onchange=function(e){var r=e.target.closest('.blk');if(!r)return;var bl=SES.blocks[+r.dataset.i],k=e.target.dataset.f,v=e.target.value;
    if(k==='min')bl.min=Math.min(60,Math.max(1,Math.round(+v)||1));else if(k==='bpm')bl.bpm=Math.min(260,Math.max(60,Math.round(+v)||120));
    else if(k==='type'){bl.type=v;if(v==='drill'&&!tutById(bl.id)){var d=tuts.find(function(t){return (t.steps||[]).length});bl.id=d&&d.id}if(v==='caller')bl.moves=bl.moves||'all'}else bl[k]=v;
    saveSes();renderBlocks();if(+r.dataset.i===SES.i&&SES.phase!=='run'){txt('s-name',blockName(SES.blocks[SES.i]));txt('s-left',fmt(SES.blocks[SES.i].min*60-SES.done))}txt('s-total','Session '+sesTotal()+' min')};
  f.onclick=function(e){var a=e.target.closest('[data-a]'),add=e.target.closest('#s-add');
    if(add){var d=tuts.find(function(t){return (t.steps||[]).length});SES.blocks.push({type:'drill',id:d&&d.id,min:2,bpm:120});saveSes();renderBlocks();txt('s-total','Session '+sesTotal()+' min');return}
    if(!a)return;var i=+a.closest('.blk').dataset.i,L=SES.blocks;
    if(a.dataset.a==='del'){L.splice(i,1);if(SES.i>=L.length){SES.i=0;SES.done=0}}
    else{var j=a.dataset.a==='up'?i-1:i+1;if(j<0||j>=L.length)return;var x=L[i];L[i]=L[j];L[j]=x}
    saveSes();renderSession()};
}

/* ===== 3. video: slow motion and A–B loop (YouTube and Vimeo through their player APIs, files natively) ===== */
var vidN=0,VID={};
function vctlHtml(id){return '<div class="vctl" data-v="'+id+'"><span class="note">Speed</span>'+[.5,.75,1].map(function(r){return '<button class="chip" data-rate="'+r+'" aria-pressed="'+(r===1)+'">'+(r===1?'1×':String(r).replace(/^0/,'')+'×')+'</button>'}).join('')+
  '<span class="sep"></span><button class="chip" data-act="back">−5 s</button><button class="chip" data-act="a">Set A</button><button class="chip" data-act="b">Set B</button><button class="chip" data-act="loop" aria-pressed="false" disabled>Loop A–B</button><button class="chip" data-act="clear" hidden>Clear</button><span class="fine vst" aria-live="polite"></span></div>'}
function vreset(){Object.keys(VID).forEach(function(k){clearInterval(VID[k].iv)});VID={}}
var scriptP={};
function loadScript(src){return scriptP[src]||(scriptP[src]=new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.async=true;s.onload=res;s.onerror=function(){delete scriptP[src];rej(new Error('load'))};document.head.appendChild(s)}))}
var ytP=null;
function ytApi(){if(window.YT&&YT.Player)return Promise.resolve();return ytP||(ytP=new Promise(function(res,rej){var prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){if(prev)prev();res()};
  var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=function(){ytP=null;rej(new Error('load'))};document.head.appendChild(s);setTimeout(function(){rej(new Error('timeout'))},10000)}))}
function vget(id){
  if(VID[id])return VID[id];var el=$(id);if(!el)return null;var v=VID[id]={id:id,a:null,b:null,loop:false,iv:null};
  if(el.tagName==='VIDEO'){v.ready=Promise.resolve();v.time=function(){return Promise.resolve(el.currentTime)};v.seek=function(s){el.currentTime=s;return Promise.resolve()};
    v.rate=function(r){el.playbackRate=r;return Promise.resolve()};v.play=function(){return el.play()}}
  else if(/youtube/.test(el.src)){
    v.ready=ytApi().then(function(){return new Promise(function(res,rej){new YT.Player(el,{events:{onReady:function(e){v.p=e.target;res()}}});setTimeout(function(){rej(new Error('timeout'))},10000)})});
    v.time=function(){return v.ready.then(function(){return v.p.getCurrentTime()})};v.seek=function(s){return v.ready.then(function(){v.p.seekTo(s,true)})};
    v.rate=function(r){return v.ready.then(function(){var av=v.p.getAvailablePlaybackRates();if(av&&av.length&&av.indexOf(r)<0)throw new Error('rate');v.p.setPlaybackRate(r)})};
    v.play=function(){return v.ready.then(function(){v.p.playVideo()})}}
  else{
    v.ready=loadScript('https://player.vimeo.com/api/player.js').then(function(){v.p=new Vimeo.Player(el);return v.p.ready()});
    v.time=function(){return v.ready.then(function(){return v.p.getCurrentTime()})};v.seek=function(s){return v.ready.then(function(){return v.p.setCurrentTime(s)})};
    v.rate=function(r){return v.ready.then(function(){return v.p.setPlaybackRate(r)})};v.play=function(){return v.ready.then(function(){return v.p.play()})}}
  v.ready.catch(function(){});return v}
function vstatus(box,v){var s=[];if(v.a!=null)s.push('A '+fmt(v.a));if(v.b!=null)s.push('B '+fmt(v.b));box.querySelector('.vst').textContent=s.length?s.join(' · ')+(v.loop?' · looping':''):'';
  var lp=box.querySelector('[data-act="loop"]');lp.disabled=!(v.a!=null&&v.b!=null);lp.setAttribute('aria-pressed',String(v.loop));box.querySelector('[data-act="clear"]').hidden=v.a==null&&v.b==null}
function vloop(v){clearInterval(v.iv);if(!v.loop)return;v.iv=setInterval(function(){v.time().then(function(s){if(v.loop&&s>=v.b-.05)v.seek(v.a)}).catch(function(){})},150)}
function vfail(src,why){toast(why==='rate'?(src==='vimeo'?'This Vimeo video does not allow speed changes (owner setting).':'This video does not offer that speed.'):'Video controls could not load for this video.')}
document.addEventListener('click',function(e){
  var btn=e.target.closest('.vctl button');if(!btn)return;var box=btn.closest('.vctl'),v=vget(box.dataset.v);if(!v)return;
  var src=/vimeo/.test(($(v.id)||{}).src||'')?'vimeo':'yt';
  if(btn.dataset.rate){var r=+btn.dataset.rate;v.rate(r).then(function(){box.querySelectorAll('[data-rate]').forEach(function(x){x.setAttribute('aria-pressed',String(x===btn))})}).catch(function(err){vfail(src,err&&err.message==='rate'||src==='vimeo'?'rate':'load')});return}
  var act=btn.dataset.act;
  if(act==='back'){v.time().then(function(s){return v.seek(Math.max(0,s-5))}).catch(function(){vfail(src,'load')});return}
  if(act==='clear'){v.a=v.b=null;v.loop=false;vloop(v);vstatus(box,v);return}
  if(act==='loop'){v.loop=!v.loop;vloop(v);if(v.loop)v.seek(v.a).then(v.play).catch(function(){});vstatus(box,v);return}
  v.time().then(function(s){
    if(act==='a'){v.a=s;if(v.b!=null&&v.b<=s+.3)v.b=null}
    else{if(v.a==null)v.a=0;if(s<=v.a+.3){toast('Set B a little after A');return}v.b=s}
    vstatus(box,v)}).catch(function(){vfail(src,'load')});
});

/* boot: inside a claude.ai artifact the tutorials live in the artifact's db;
   anywhere else (your own server) they come from this app's /api/tutorials */
function received(list){
  tuts=list.map(function(x){x=Object.assign({},x);x.steps=(x.steps||[]).slice();return x})
    .sort(function(a,b){return (a.order||0)-(b.order||0)});
  var first=!ready;ready=true;
  if(first&&!sel&&tuts.length)sel=tuts[0].id;
  if(sel&&!current())sel=null;
  renderList();renderView();
  if(first&&mode==='practice')renderPractice();
}
fromHash();
async function load(){var r=await fetch('api/tutorials',{cache:'no-store'});if(!r.ok)throw new Error('failed');return r.json()}
(async function(){
  var c=window.claude;
  if(!c||!c.use){try{received(await load())}catch(e){fail()}return}
  var db=await c.use('db');
  if(!db){fail();return}
  db.collection('tutorials').orderBy('order').onSnapshot(function(snap){
    received(snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x}));
  },function(){fail()});
})();
function fail(){ready=true;$('countInfo').textContent='';$('main').innerHTML='<section class="sheet"><div class="empty"><strong>Tutorials not available</strong><span>The tutorials could not be loaded. Check that the server is running, then reload the page.</span></div></section>';renderList()}
})();
